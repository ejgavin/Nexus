<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus — Page not found</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060c1a'/%3E%3Cpath d='M16 48V16h7l18 21V16h7v32h-7L23 27v21z' fill='%2360a5fa'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#060c1a;color:#c8d8f0}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 80% 70% at 50% -10%,#172d61 0,transparent 65%),#060c1a}
    main{width:min(520px,100%);padding:34px;border:1px solid rgba(90,150,255,.35);border-radius:18px;background:rgba(11,20,40,.9);box-shadow:0 24px 70px rgba(0,0,0,.28);text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 22px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#3b7ef6,#22d3ee);color:#fff;font-size:32px;font-weight:800;letter-spacing:-.08em}
    .eyebrow{margin:0 0 8px;color:#60a5fa;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;color:#eff6ff;font-size:30px;letter-spacing:-.03em}
    p{margin:12px 0 24px;color:#8aa3c8;line-height:1.6;font-size:14px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 16px;border-radius:9px;background:#3b7ef6;color:#fff;text-decoration:none;font-size:13px;font-weight:700}
    a:hover{background:#60a5fa}
  </style>
</head>
<body>
  <main>
    <div class="mark">N</div>
    <p class="eyebrow">Nexus</p>
    <h1>Page not found</h1>
    <p>The address you opened does not exist in this Nexus build.</p>
    <a href="./index.svg">Return to Nexus</a>
  </main>
</body>
</html>
