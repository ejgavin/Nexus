    // before the IDB reset IIFE so it can log its own steps) ────────────

      // [Nexus:embed] to separate shell logs from proxied-page logs.
      var DEBUG = true;

      return { log: log, warn: warn, err: err };
    })();

    // ── Guaranteed IDB schema ──────────────────────────────────────────────
    // Scramjet's bundle has multiple call sites that all do
    // `indexedDB.open("$scramjet", 1, ...)`, but only ONE of them (openIDB(),
    // used by the page-side controller) actually passes an `upgrade`
    // callback that creates the five object stores. Several others —
    // including one fired unconditionally, unawaited, with no try/catch,
    // straight out of the ScramjetServiceWorker CONSTRUCTOR — open the same
    // db/version with NO upgrade callback at all. Whichever of these opens
    // a nonexistent "$scramjet" database FIRST wins the one-time
    // onupgradeneeded event. If it's one of the callback-less ones, the
    // stores never get created, the db is permanently stuck at version 1
    // with zero stores (upgrade() can't re-run without a version bump we
    // don't control), and every real operation afterward throws
    // "NotFoundError: ... object store was not found" forever. This was a
    // pure coin-flip race, which is why deleting-and-recreating the db
    // "fixed" it sometimes and silently re-broke it other times.
    //
    // Fix: don't leave it to chance. Deterministically create the correct
    // schema ourselves, unconditionally, before Scramjet's own code gets a
    // chance to lose that race. This is safe to run on every single page
    // load — opening an already-correctly-schemaed db at a matching
    // version is a no-op (upgrade() simply doesn't fire), so it never
    // touches or wipes existing cookies/config data.
    window.__nexusIdbReady = new Promise(function (resolve) {
      var L = window.__nexusLog;
      try {
        var req = indexedDB.open('$scramjet', 1);
        req.onupgradeneeded = function (ev) {
          var db = ev.target.result;
          ['config', 'cookies', 'redirectTrackers', 'referrerPolicies', 'publicSuffixList'].forEach(function (name) {
            if (!db.objectStoreNames.contains(name)) db.createObjectStore(name);
          });
          L.log('IDB schema created/verified (won the race against Scramjet\'s own no-upgrade-callback open calls)');
        };
        req.onsuccess = function (ev) {
          try { ev.target.result.close(); } catch (e) {}
          resolve();
        };
        req.onerror = function () {
          L.err('IDB schema-guarantee open failed', req.error);
          resolve(); // don't hang the page over this
        };
      } catch (e) {
        L.err('IDB schema-guarantee threw synchronously', e);
        resolve();
      }
    });
  </script>

      referrerQuery.get('httpbridgews') === '1' ||
      referrerQuery.get('transport') === 'httpbridge' ||
      referrerQuery.get('transport') === 'hybrid')) ||
    (transportQuery.get('transport') !== 'wisp' && localStorage.getItem('nexus-httpbridge-setting') !== '0') ||
    (typeof _CONFIG !== 'undefined' && _CONFIG.transport === 'httpbridge');
  var useHttpBridgeWsOnly = useHttpBridge && (
    transportQuery.get('httpbridgews') === '1' ||
    transportQuery.get('transport') === 'hybrid' ||
    (referrerQuery && (referrerQuery.get('httpbridgews') === '1' || referrerQuery.get('transport') === 'hybrid')) ||
    ((!transportQuery.has('httpbridge') && !transportQuery.has('httpbridgews') && !transportQuery.has('transport')) &&
      (!referrerQuery || (!referrerQuery.has('httpbridge') && !referrerQuery.has('httpbridgews') && !referrerQuery.has('transport'))) &&
      localStorage.getItem('nexus-httpbridge-ws-setting') === '1') ||
    (typeof _CONFIG !== 'undefined' && _CONFIG.transport === 'hybrid'));
  var useSseWs = useHttpBridge && (transportQuery.get('ssews') === '1' ||
    (referrerQuery && referrerQuery.get('ssews') === '1') ||
    ((!transportQuery.has('ssews') && (!referrerQuery || !referrerQuery.has('ssews'))) &&
      localStorage.getItem('nexus-sse-ws-setting') === '1'));
  if (useHttpBridge) {
    if (!transportQuery.has('httpbridge') && !transportQuery.has('httpbridgews') && !transportQuery.has('ssews') && !transportQuery.has('transport')) {
      try {
        history.replaceState(null, '', location.pathname + '?httpbridge=1' + (useHttpBridgeWsOnly ? '&httpbridgews=1' : '') + (useSseWs ? '&ssews=1' : '') + location.hash);
        transportQuery = new URLSearchParams(location.search);
        log('restored httpbridge flag after URL rewrite', location.href);
      } catch (_) {}
    }
  }
  var store = {
    wispurl: normalizeWispEndpoint(configuredWisp) + (socksEnabled ? '?socks=1' : ''),
    bareurl: (typeof _CONFIG !== 'undefined' && _CONFIG.bareurl) ||
      location.protocol + '//' + location.host + '/api/edge/',
    bridgeurl: (typeof _CONFIG !== 'undefined' && _CONFIG.bridgeurl) ||
      location.protocol + '//' + location.host + '/api/wsbridge/',
    ssebridgeurl: (typeof _CONFIG !== 'undefined' && _CONFIG.ssebridgeurl) ||
      location.protocol + '//' + location.host + '/api/ssebridge/',
  };
  if (socksEnabled) store.bareurl += (store.bareurl.indexOf('?') >= 0 ? '&' : '?') + 'socks=1';
  var bridgeTransportModule = location.origin + '/httpbridge/index.mjs';
  // Keep transport fallback fixes from being hidden by a stale browser/CDN
  // module cache after a static deployment.
  var hybridTransportModule = location.origin + '/hybrid/index.mjs?build=math-v5-httpfallback-3';
  log('transport mode resolved', {
    httpBridge: useHttpBridge,
    httpBridgeWebSocketsOnly: useHttpBridgeWsOnly,
    query: location.search,
    controller: navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : null,
    bridge: store.bridgeurl,
    sseBridge: useSseWs ? store.ssebridgeurl : null,
  });
  log('transport endpoints resolved', store);

  var readyPromise = null;
  var transportReady = false;
  var frame = null;

  function hostnameMatchesPattern(hostname, pattern) {
    hostname = hostname.toLowerCase();
    pattern = pattern.toLowerCase().trim();
    if (!pattern) return false;

    var base = pattern.replace(/^\*\./, '').replace(/^https?:\/\//, '').replace(/\/$/, '');
    return hostname === base || hostname.endsWith('.' + base);
  }

  function isRestrictionActive() {
    return restrictPatterns.length > 0;
  }

  function isAllowedHostname(hostname) {
    if (!isRestrictionActive()) return true;
    for (var i = 0; i < restrictPatterns.length; i++) {
      if (hostnameMatchesPattern(hostname, restrictPatterns[i])) return true;
    }
    return false;
  }

  function isUrlAllowed(url) {
    try { return isAllowedHostname(new URL(url).hostname); } catch (e) { return false; }
  }

  // The domain root to fall back to when the very first requested URL
  // violates the restriction and there's no "last good page" to return to
  // yet. Derived from the first pattern, stripping any "*." wildcard prefix.
  function restrictionHomeUrl() {
    if (!isRestrictionActive()) return null;
    var base = restrictPatterns[0].replace(/^\*\./, '');
    return 'https://' + base + '/';
  }

  var lastAllowedUrl = null;
  var restrictToastTimer = null;

  function showRestrictToast(hostname) {
    var el = document.getElementById('restrict-toast');
    var textEl = document.getElementById('restrict-toast-text');
    if (!el || !textEl) return;
    textEl.innerHTML = 'Locked to <b>' + restrictPatterns.join(', ') + '</b>';
    el.classList.add('show');
    if (restrictToastTimer) clearTimeout(restrictToastTimer);
    restrictToastTimer = setTimeout(function () {
      el.classList.remove('show');
    }, 3000);
  }

  function updateLockBanner() {
    if (isRestrictionActive()) showRestrictToast();
  }

  updateLockBanner();
  var restrictClose = document.getElementById('restrict-close');
  if (restrictClose) restrictClose.addEventListener('click', function () {
    var toast = document.getElementById('restrict-toast');
    if (toast) toast.classList.remove('show');
    if (restrictToastTimer) clearTimeout(restrictToastTimer);
  });

  // ── helpers ────────────────────────────────────────────────────────────────
  function setStatus(text) {
    var el = document.getElementById('status');
    if (!el) return;
    if (!text) { el.classList.add('hide'); return; }
    el.classList.remove('hide');
    el.querySelector('p').textContent = text;
  }

  function decodeUrlToken(value) {
    if (value.indexOf('b64.') !== 0) return value;
    try {
      var encoded = value.slice(4).replace(/-/g, '+').replace(/_/g, '/');
      while (encoded.length % 4) encoded += '=';
      var binary = atob(encoded);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    } catch (_) { return ''; }
  }

  function parseHashUrl() {
    var raw = location.hash.slice(1).trim();
    if (!raw) return '';
    raw = decodeUrlToken(raw);
    try { raw = decodeURIComponent(raw); } catch (e) {}
    if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw.replace(/^\/+/, '');
    try {
      var u = new URL(raw);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
      return u.href;
    } catch (e) { return ''; }
  }

  var isSnappingBack = false;

  function isLikelyResourceUrl(value) {
    try {
      var u = new URL(value);
      var host = u.hostname.toLowerCase();
      var path = u.pathname.toLowerCase();
      if (/\.(m3u8|m3u|ts|m4s|mp4|webm|aac|mp3|jpg|jpeg|png|gif|webp|ico|svg|woff2?|ttf|css|js|json)(?:$|[?#])/.test(path)) return true;
      if (host.endsWith('.twitchcdn.net') || host.endsWith('.ttvnw.net') || path === '/fp' || path.indexOf('/fp/') === 0) return true;
    } catch (_) {}
    return false;
  }

  function reportNav(realUrl, title) {
    if (!realUrl) return;
    if (isLikelyResourceUrl(realUrl)) {
      log('ignoring resource URL navigation event', realUrl);
      return;
    }

    if (isRestrictionActive() && !isUrlAllowed(realUrl)) {
      // Don't report the blocked URL to the parent (keeps the address bar
      // showing the last legitimate page instead of flashing the blocked one).
      var hostname = '';
      try { hostname = new URL(realUrl).hostname; } catch (e) {}
      warn('navigation blocked by domain restriction', hostname, 'allowed:', restrictPatterns);
      showRestrictToast(hostname);
      window.parent.postMessage({
        type: 'nexus-restricted',
        attemptedUrl: realUrl,
        allowed: restrictPatterns,
      }, '*');

      if (!isSnappingBack && frame) {
        isSnappingBack = true;
        var target = lastAllowedUrl || restrictionHomeUrl();
        if (target) {
          log('snapping back to last allowed url', target);
          // Small delay so the toast is visible before the page swaps back
          setTimeout(function () {
            try { frame.go(target); } catch (e) { err('snap-back frame.go() threw', e); }
            isSnappingBack = false;
          }, 180);
        } else {
          isSnappingBack = false;
        }
      }
      return;
    }

    lastAllowedUrl = realUrl;
    log('reportNav -> parent', realUrl, title || '');
    window.parent.postMessage({ type: 'nexus-nav', url: realUrl, title: title || '' }, '*');
  }

  // ── transport ──────────────────────────────────────────────────────────────
  async function waitForTransport() {
    if (transportReady) return;
    log('waitForTransport() starting');
    if (useHttpBridge) {
      // Full HTTP mode must never fall through to Wisp. A WebSocket-blocking
      // extension would make that fallback hang even though the HTTP bridge
      // is the selected transport. Retry the bridge itself for startup races.
      var lastBridgeError = null;
      for (var bridgeAttempt = 0; bridgeAttempt < 8; bridgeAttempt++) {
        try {
          if (useHttpBridgeWsOnly) {
            await connection[setT](hybridTransportModule, [store.wispurl, store.bridgeurl, useSseWs ? store.ssebridgeurl : '']);
            log('transport set: Wisp + ' + (useSseWs ? 'SSE WebSocket bridge' : 'HTTP bridge for WebSockets'), { wisp: store.wispurl, bridge: store.bridgeurl, sseBridge: useSseWs ? store.ssebridgeurl : null });
          } else {
            await connection[setT](bridgeTransportModule, [store.bridgeurl, useSseWs ? store.ssebridgeurl : '']);
            log('transport set: HTTP bridge for pages + ' + (useSseWs ? 'SSE WebSockets' : 'WebSockets'), { bridge: store.bridgeurl, sseBridge: useSseWs ? store.ssebridgeurl : null });
          }
          transportReady = true;
          return;
        } catch (bridgeError) {
          lastBridgeError = bridgeError;
          warn('HTTP transport setup attempt ' + (bridgeAttempt + 1) + '/8 failed', transportErrorDetails(bridgeError));
          await new Promise(function (resolve) {
            setTimeout(resolve, Math.min(1000, 150 + bridgeAttempt * 150));
          });
        }
      }
      err('HTTP transport unavailable; Wisp fallback disabled', transportErrorDetails(lastBridgeError));
      throw new Error('HTTP transport unavailable: ' + transportErrorDetails(lastBridgeError));
    }
    for (var i = 0; i < 8; i++) {
      try {
        var o = {}; o[wispKey] = store.wispurl;
        await connection[setT]('/e7px/index.mjs', [o]);
        log('transport set: wisp (/e7px)', store.wispurl);
        transportReady = true;
        return;
      } catch (e1) {
        try {
          var o2 = {}; o2[wispKey] = store.wispurl;
          await connection[setT]('/l9cx/index.mjs', [o2]);
          log('transport set: wisp fallback (/l9cx)', store.wispurl);
          transportReady = true;
          return;
        } catch (e2) {
          try {
            await connection[setT]('/m4thx/index.mjs', [store.bareurl]);
            log('transport set: bare (/m4thx)', store.bareurl);
            transportReady = true;
            return;
          } catch (e3) {
            if (i >= 7) {
              try {
                if (useHttpBridgeWsOnly) {
                  await connection[setT](hybridTransportModule, [store.wispurl, store.bridgeurl, useSseWs ? store.ssebridgeurl : '']);
                  log('transport set: Wisp + ' + (useSseWs ? 'SSE WebSocket bridge fallback' : 'HTTP bridge fallback for WebSockets'), { wisp: store.wispurl, bridge: store.bridgeurl, sseBridge: useSseWs ? store.ssebridgeurl : null });
                } else {
                  await connection[setT](bridgeTransportModule, [store.bridgeurl, useSseWs ? store.ssebridgeurl : '']);
                  log('transport set: HTTP bridge' + (useSseWs ? ' + SSE WebSocket' : '') + ' fallback', { bridge: store.bridgeurl, sseBridge: useSseWs ? store.ssebridgeurl : null });
                }
                transportReady = true;
                return;
              } catch (bridgeError) {
                err('waitForTransport() exhausted all attempts: ' + JSON.stringify({
                  e1: transportErrorDetails(e1),
                  e2: transportErrorDetails(e2),
                  e3: transportErrorDetails(e3),
                  bridge: transportErrorDetails(bridgeError)
                }));
                throw new Error('No transport available');
              }
            }
            warn('transport negotiation attempt ' + (i + 1) + '/8 failed, retrying', { e1: e1, e2: e2, e3: e3 });
            await new Promise(function(r){ setTimeout(r, Math.min(800, 180 * (i + 1))); });
          }
        }
      }
    }
  }

  // Wait for the SW to explicitly confirm ("nexus$type: configAck") that it
  // has processed a loadConfig message and _engine.config is actually set.
  // engine.init()'s postMessage is fire-and-forget — awaiting it only means
  // the message was SENT, not that the SW finished handling it. Without this
  // handshake, a navigation right after engine.init() can race ahead of the
  // SW's message handler and hit _engine.fetch() with config still unset,
  // crashing with "Cannot read properties of undefined (reading 'prefix')".
  function waitForConfigAck(timeoutMs) {
    return new Promise(function (resolve) {
      var settled = false;
      log('config ack listener installing', {
        timeoutMs: timeoutMs,
        controller: navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : null,
        state: navigator.serviceWorker.controller ? 'controlled' : 'not-controlled',
      });
      function onMsg(e) {
        if (e.data && e.data.nexus$type === 'configAck') {
          if (settled) return;
          settled = true;
          navigator.serviceWorker.removeEventListener('message', onMsg);
          log('SW acked config', {
            ready: !!e.data.ready,
            source: e.source && e.source.id ? e.source.id : null,
            controller: navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : null,
          });
          resolve(!!e.data.ready);
        }
      }
      navigator.serviceWorker.addEventListener('message', onMsg);
      log('config ack listener installed');
      setTimeout(function () {
        if (settled) return;
        settled = true;
        navigator.serviceWorker.removeEventListener('message', onMsg);
        warn('SW config ack timed out after ' + timeoutMs + 'ms', {
          controller: navigator.serviceWorker.controller ? navigator.serviceWorker.controller.scriptURL : null,
        });
        resolve(false);
      }, timeoutMs);
    });
  }

  async function sendConfigAndWait() {
    await window.__nexusIdbReady;
    log('sendConfigAndWait() -> engine.init()');
    await engine.init();
    log('engine.init() returned; waiting for SW config acknowledgment');
    var ok = await waitForConfigAck(10000);
    if (!ok) {
      warn('config ack failed, retrying engine.init() once');
      // One retry — covers a slow-starting SW thread
      await engine.init();
      ok = await waitForConfigAck(10000);
    }
    log('sendConfigAndWait() resolved', ok);
    return ok;
  }

  async function ensureReady() {
    if (readyPromise) return readyPromise;
    log('ensureReady() starting SW registration');
    readyPromise = (async function () {
      // Register SW first and wait for it to be active
      // Change this identifier whenever transport code changes. Service
      // workers can otherwise keep an older 1k123.js alive after a Netlify
      // deployment, making the browser appear to ignore the HTTP bridge.
      var reg = await navigator.serviceWorker.register('/1k123.js?build=math-v5-wsdiag', {
        updateViaCache: 'none',
        scope: '/',
      });
      log('SW registered', reg.scope);
      await navigator.serviceWorker.ready;
      log('SW ready');

      // Install the transport before sending config. The SW can issue an
      // early proxied fetch during startup; doing this afterward caused the
      // console error "there are no bare clients" and broke WebSockets.
      await waitForTransport();

      // Send config and wait for the SW's real acknowledgment — not just
      // that engine.init() resolved, but that _engine.config is confirmed set.
      var acked = await sendConfigAndWait();
      if (!acked) {
        warn('SW did not acknowledge config in time — proceeding anyway, first request may 503 and retry.');
      }

      // Re-send config whenever the SW restarts (e.g. after browser idle kill)
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        log('SW controllerchange — re-sending config');
        sendConfigAndWait();
      });

      log('ensureReady() complete');
    })();
    try { return await readyPromise; }
    catch (e) { readyPromise = null; transportReady = false; throw e; }
  }

  // ── navigation ─────────────────────────────────────────────────────────────
  async function loadUrl(url) {
    log('loadUrl() called', url);
    if (!url) {
      setStatus('Enter a URL — e.g. /embed.html#https://example.com');
      return;
    }

    if (isRestrictionActive() && !isUrlAllowed(url)) {
      var hostname = '';
      try { hostname = new URL(url).hostname; } catch (e) {}
      warn('loadUrl() target blocked by restriction', hostname);
      showRestrictToast(hostname);
      window.parent.postMessage({
        type: 'nexus-restricted',
        attemptedUrl: url,
        allowed: restrictPatterns,
      }, '*');

      if (!frame) {
        // No page loaded yet at all — substitute the restricted domain's
        // root and fall through to load THAT instead of the disallowed URL.
        var home = restrictionHomeUrl();
        if (home && isUrlAllowed(home)) {
          log('no frame yet — substituting restriction home url', home);
          url = home;
        } else {
          setStatus('Unable to open that page');
          return;
        }
      } else {
        // Already browsing — snap back to the last good page instead of
        // ever navigating to the disallowed target. Bail out entirely so
        // we don't fall through to frame.go(url) below with a bad URL.
        var target = lastAllowedUrl || restrictionHomeUrl();
        if (target && target !== url) {
          log('already browsing — snapping to', target, 'instead of blocked', url);
          try { frame.go(target); } catch (e) { err('blocked-nav snap-back frame.go() threw', e); }
        }
        return;
      }
    }

    reportNav(url, '');
    setStatus('Connecting…');

    try {
      await ensureReady();
    } catch (e) {
      err('ensureReady() rejected — transport setup failed', e);
      setStatus('Transport failed — try refreshing');
      window.parent.postMessage({ type: 'nexus-error', message: e.message }, '*');
      return;
    }

    var container = document.getElementById('container');
    container.innerHTML = '';

    // Capture a snapshot of the frame reference for this navigation.
    // The module-level `frame` variable gets reassigned on the next loadUrl()
    // call — without this capture, any async callbacks (load, MutationObserver)
    // that fire late would read the NEW frame and report its URL under the
    // OLD site's identity, corrupting the address bar.
    var thisFrame = engine[mkFrame]();
    frame = thisFrame;
    container.appendChild(thisFrame.frame);
    log('new browsing frame created for', url);

    // ── URL tracking via Scramjet's urlchange event ────────────────────────
    thisFrame.addEventListener('urlchange', function (e) {
      if (thisFrame !== frame) { log('ignoring urlchange from superseded frame'); return; }
      var title = '';
      try { title = thisFrame.frame.contentDocument.title || ''; } catch (_) {}
      reportNav(e.url, title);
    });

    thisFrame.addEventListener('contextInit', function (e) {
      if (thisFrame !== frame) { log('ignoring contextInit from superseded frame'); return; }
      // contextInit also fires for nested documents used by sites for
      // sign-in, APIs, and media. They are not top-level URL navigation and
      // must not trigger the embed restriction or replace the address bar.
      log('ignoring nested contextInit navigation event');
    });

    thisFrame.frame.addEventListener('load', function () {
      if (thisFrame !== frame) { log('ignoring load event from superseded frame'); return; }
      try {
        watchProxiedDocument(thisFrame.frame, url);
        var realUrl = engine.decodeUrl(thisFrame.frame.contentWindow.location.href);
        var title   = thisFrame.frame.contentDocument.title || '';
        if (realUrl) reportNav(realUrl, title);

        var titleEl = thisFrame.frame.contentDocument.querySelector('title');
        if (titleEl) {
          var mo = new MutationObserver(function () {
            if (thisFrame !== frame) { log('disconnecting stale title observer'); mo.disconnect(); return; }
            try {
              var u = engine.decodeUrl(thisFrame.frame.contentWindow.location.href);
              reportNav(u, thisFrame.frame.contentDocument.title || '');
            } catch (_) {}
          });
          mo.observe(titleEl, { childList: true, characterData: true, subtree: true });
        }
      } catch (e) { err('frame load handler threw', e); }
    });

    thisFrame.go(url);
    setTimeout(function () { setStatus(''); }, 600);
  }

  function loadFromHash() {
    loadUrl(parseHashUrl());
  }

  // Dynamically apply a new restriction (from the "Apply" button in the
  // parent UI) without reloading the whole embed page — keeps the SW and
  // transport warm. If the page currently loaded no longer satisfies the
  // new restriction, it's no longer safe to use as a snap-back target, so
  // clear it first and let the enforcement gate fall back to the new
  // restriction's own home URL instead of looping back to the stale page.
  function applyRestriction(patternsList) {
    restrictPatterns = patternsList || [];
    log('applyRestriction()', restrictPatterns);
    updateLockBanner();

    // Re-propagate into the Scramjet config so popup/window.open blocking
    // (enforced inside the proxied page's own runtime, via config.$W read
    // by the patched window.open hook) picks up the change too — not just
    // in-frame navigation. SJ_CONFIG.restrictPatterns was only merged into
    // the global config once, at construction; simply reassigning the
    // outer variable here does not retroactively update that. Constructing
    // a fresh controller with the updated config and calling init() on it
    // re-runs that merge and re-notifies the SW, without disturbing the
    // existing engine/frame/transport, which are separate objects.
    try {
      SJ_CONFIG.restrictPatterns = restrictPatterns;
      var refreshCtrl = new packed[SJCtrl](SJ_CONFIG);
      refreshCtrl.init().catch(function () {});
    } catch (e) {}

    if (!isRestrictionActive()) return;
    if (lastAllowedUrl && !isUrlAllowed(lastAllowedUrl)) {
      var staleUrl = lastAllowedUrl;
      lastAllowedUrl = null;
      reportNav(staleUrl, '');
    }
  }

  // ── commands from parent ───────────────────────────────────────────────────
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'nexus-cmd') return;
    log('received cmd from parent', e.data.cmd, e.data);
    if (e.data.cmd === 'back') {
      try { if (frame) frame.frame.contentWindow.history.back(); } catch (e2) { err('back cmd threw', e2); }
    } else if (e.data.cmd === 'forward') {
      try { if (frame) frame.frame.contentWindow.history.forward(); } catch (e2) { err('forward cmd threw', e2); }
    } else if (e.data.cmd === 'audioToggle') {
      try {
        var media = frame && frame.frame.contentDocument ? frame.frame.contentDocument.querySelectorAll('audio,video') : [];
        var shouldMute = Array.from(media).some(function (el) { return !el.muted; });
        Array.from(media).forEach(function (el) { el.muted = shouldMute; });
      } catch (e2) { err('audio toggle cmd threw', e2); }
    } else if (e.data.cmd === 'reload') {
      try { if (frame) frame.frame.contentWindow.location.reload(); } catch (e2) { err('reload cmd threw', e2); }
    } else if (e.data.cmd === 'go') {
      loadUrl(e.data.url);
    } else if (e.data.cmd === 'setRestrict') {
      applyRestriction(e.data.patterns);
    } else if (e.data.cmd === 'setClean') {
      cleanEnabled = !!e.data.enabled || !!String(e.data.selector || '').trim();
      cleanSelector = String(e.data.selector || '').trim();
      watchProxiedDocument(frame && frame.frame, lastAllowedUrl);
      log('page cleanup updated', { enabled: cleanEnabled, selector: cleanSelector });
    } else if (e.data.cmd === 'setAdblock') {
      adblockEnabled = e.data.enabled !== false;
      blockAdsInDocument(cleanFrameDocument);
      log('ad blocker updated', adblockEnabled);
    }
  });

  window.addEventListener('hashchange', loadFromHash);
  window.addEventListener('load', loadFromHash);
})();
</script>
</body>
</html>
