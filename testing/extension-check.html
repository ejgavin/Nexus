<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extension Check</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f4f6f8;
      color: #17202a;
    }

    main {
      width: min(90vw, 440px);
      padding: 2rem;
      border-radius: 16px;
      background: white;
      box-shadow: 0 10px 30px rgb(0 0 0 / 12%);
      text-align: center;
    }

    h1 { margin-top: 0; }

    #status {
      margin: 1.5rem 0 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .checking { color: #59636e; }
    .installed { color: #16803c; }
    .missing { color: #c62828; }

    @media (prefers-color-scheme: dark) {
      body { background: #121518; color: #eef2f5; }
      main { background: #1d2329; }
      .checking { color: #b9c2ca; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Chrome Extension Check</h1>
    <p id="status" class="checking" aria-live="polite">Checking…</p>
  </main>

  <script>
    const extensionConfigUrl =
      "chrome-extension://ldeacmimdpnggeapjhefpcpcbepafeba/injectionConfig.js";
    const status = document.querySelector("#status");

    fetch(extensionConfigUrl, { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        status.textContent = "The extension is installed.";
        status.className = "installed";
      })
      .catch(() => {
        status.textContent = "The extension is not installed.";
        status.className = "missing";
      });
  </script>
</body>
</html>
